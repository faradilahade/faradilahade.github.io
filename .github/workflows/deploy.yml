name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Reads the real Pages URL for this repo (and enables Pages with the
      # "GitHub Actions" source if it is not enabled yet).
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      # Base path comes from the actual Pages configuration, so it is right
      # even after the repository is renamed or a re-run uses an old event:
      #   user site  faradilahade.github.io  ->  "/"
      #   project    <owner>/<repo>          ->  "/<repo>/"
      - name: Resolve base path
        id: base
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          set -eu
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ -n "${PAGES_BASE_URL}" ]; then
            BASE="$(printf '%s' "${PAGES_BASE_URL}" | sed -E 's#^https?://[^/]+##')"
            ORIGIN="${PAGES_ORIGIN}"
          else
            ORIGIN="https://${OWNER}.github.io"
            if [ "$(printf '%s' "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "${OWNER}.github.io" | tr '[:upper:]' '[:lower:]')" ]; then
              BASE=""
            else
              BASE="/${REPO_NAME}"
            fi
          fi
          case "${BASE}" in
            "" ) BASE="/" ;;
            */) ;;
            * ) BASE="${BASE}/" ;;
          esac
          echo "VITE_BASE=${BASE}" >> "$GITHUB_ENV"
          echo "VITE_SITE_ORIGIN=${ORIGIN}" >> "$GITHUB_ENV"
          echo "Building for ${ORIGIN}${BASE}"

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
